name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Smoke test policy export and gate reuse
        run: |
          mkdir -p build
          eval-threshold-calibrator \
            --history examples/history.jsonl \
            --current examples/current.jsonl \
            --config examples/config.json \
            --output-md build/report.md \
            --output-json build/report.json \
            --output-junit build/junit.xml \
            --output-policy build/eval-threshold-policy.json \
            --fail-on-current
          eval-threshold-calibrator \
            --policy build/eval-threshold-policy.json \
            --current examples/current.jsonl \
            --output-json build/policy-gate.json \
            --output-junit build/policy-gate.xml \
            --fail-on-current \
            --stdout json
