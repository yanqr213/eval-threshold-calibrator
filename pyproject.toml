[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-threshold-calibrator"
version = "0.1.0"
description = "Offline threshold calibration for LLM/RAG/agent eval CI gates."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "eval-threshold-calibrator contributors"}]
keywords = ["eval", "llm", "rag", "ci", "threshold", "calibration"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
eval-threshold-calibrator = "eval_threshold_calibrator.cli:main"

[tool.setuptools.packages.find]
include = ["eval_threshold_calibrator*"]
